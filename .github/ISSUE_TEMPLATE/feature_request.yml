name: Feature request
description: Suggest a focused improvement to Glance.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the screenshot workflow you are trying to improve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives you have considered, if any.
    validations:
      required: true
