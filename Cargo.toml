[package]
name = "pachiri"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
image = "0.25"
imageproc = "0.25"
global-hotkey = "0.7"
arboard = "3.6"
smallvec = "1"
ab_glyph = "0.2"
async-channel = "2"
lyon = "1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
gif = "0.14"
color_quant = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
block = "0.1"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support", "runtime_shaders"] }

[profile.release]
lto = "thin"
strip = true
